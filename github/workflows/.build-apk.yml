
name: Compilar APK de Automix

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descomprimir proyecto
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir -p project
          unzip -q Automix-listo-para-GitHub.zip -d project

      - name: Compilar APK
        run: |
          WRAPPER=$(find project -type f -name gradlew -print -quit)
          if [ -z "$WRAPPER" ]; then
            echo "ERROR: No se encontró gradlew dentro del ZIP."
            echo "El proyecto puede necesitar archivos de Gradle."
            exit 1
          fi
          cd "$(dirname "$WRAPPER")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Automix-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
